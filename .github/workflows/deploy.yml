name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: sed -i "s|const DEFAULT_TOKEN    = '__SYNC_TOKEN__'|const DEFAULT_TOKEN    = '${SYNC_TOKEN}'|g" js/app.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
