<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <meta name="theme-color" content="#7c6af7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT Player">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ── Bannière installation PWA ── -->
    <div class="install-banner" id="install-banner">
        <span>&#128241; Installe l'app pour écouter en arrière-plan</span>
        <button class="btn-install" id="btn-install">Installer</button>
        <button class="btn-install-close" id="btn-install-close">&#xD7;</button>
    </div>

    <!-- ── Écran de sélection de profil ── -->
    <div class="profile-screen" id="profile-screen">
        <div class="profile-screen-content">
            <h2 class="profile-screen-title">Qui écoute ?</h2>
            <div class="profile-list" id="profile-list"></div>
            <button class="btn-add-profile" id="btn-add-profile">+ Ajouter un profil</button>
        </div>
    </div>

    <!-- ── Modale de recherche YouTube ── -->
    <div class="search-modal" id="search-modal">
        <div class="search-modal-box">
            <div class="search-modal-header">
                <span class="search-modal-title">&#128269; Rechercher sur YouTube</span>
                <button class="btn-icon" id="btn-search-close" title="Fermer">&#xD7;</button>
            </div>
            <input type="text" id="search-input" class="inp search-inp" placeholder="Titre, artiste, album…" autocomplete="off">
            <div class="search-results" id="search-results">
                <p class="empty">Tapez pour rechercher…</p>
            </div>
        </div>
    </div>

    <!-- ── Application principale ── -->
    <div class="app">

        <aside class="sidebar">
            <div class="sidebar-top">
                <span class="app-title">&#9835; YT Player</span>
                <button class="profile-badge" id="profile-badge" title="Changer de profil"></button>
                <span class="sync-dot" id="sync-status" title="Statut sync"></span>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="section-label">PLAYLISTS</span>
                    <button class="btn-icon" id="btn-new-playlist" title="Nouvelle playlist">+</button>
                </div>
                <div class="playlist-tabs" id="playlist-tabs"></div>
            </div>

            <div class="section tracks-section">
                <div class="section-header">
                    <span class="section-label">PISTES</span>
                    <div class="track-actions">
                        <button class="btn-icon" id="btn-shuffle" title="Lecture aléatoire">&#8652;</button>
                        <button class="btn-icon danger" id="btn-clear" title="Vider la playlist">&#8998;</button>
                    </div>
                </div>
                <div class="track-list" id="track-list"></div>
            </div>

            <div class="add-form">
                <button class="btn-search-open" id="btn-search-open">&#128269; Rechercher sur YouTube</button>
                <div class="add-divider"><span>ou coller un lien</span></div>
                <input type="text" id="url-input" class="inp" placeholder="https://youtube.com/watch?v=…">
                <input type="text" id="title-input" class="inp" placeholder="Titre personnalisé (optionnel)">
                <button class="btn-primary" id="btn-add">Ajouter à la playlist</button>
            </div>
        </aside>

        <main class="main">
            <div class="player-wrap">
                <div class="yt-box">
                    <div id="player-placeholder" class="placeholder">
                        <div>
                            <div class="placeholder-icon">&#9835;</div>
                            <p>Ajoutez des musiques<br>et lancez la lecture</p>
                        </div>
                    </div>
                    <div id="yt-player"></div>
                </div>

                <div class="now-playing">
                    <div class="np-title" id="track-title">–</div>
                    <div class="np-meta" id="track-meta"></div>
                </div>

                <div class="controls">
                    <button class="ctrl-btn" id="btn-prev" title="Précédent">&#9198;</button>
                    <button class="ctrl-btn ctrl-main" id="btn-play-pause" title="Lecture / Pause">&#9654;</button>
                    <button class="ctrl-btn" id="btn-next" title="Suivant">&#9197;</button>
                </div>

                <div class="shortcuts-hint">
                    Raccourcis : <kbd>Espace</kbd> play/pause &nbsp;·&nbsp; <kbd>←</kbd> précédent &nbsp;·&nbsp; <kbd>→</kbd> suivant
                </div>
            </div>
        </main>

    </div>

    <script src="js/app.js"></script>
    <script async src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
